<header class="header-section">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-md-6">
                <h1 class="main-title">
                    <a href="{% url 'publications:mis papers' %}" class="title-link">
                        Publish Tracker
                    </a>
                </h1>
            </div>
            <div class="col-md-6 text-end">
                <nav class="main-navigation">
                    <div class="action-buttons">
                        <a href="{% url 'publications:mis papers' %}" class="btn btn-outline-secondary me-2">
                            <i class="fas fa-file-alt"></i> Mis papers
                        </a>
                        <a href="#" class="btn btn-outline-secondary me-2">
                            <i class="fas fa-users"></i> Autores
                        </a>
                        <a href="#" class="btn btn-outline-secondary">
                            <i class="fas fa-book"></i> Revistas
                        </a>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</header>

<!-- Contenedor para la Alerta de Actualización -->
<div class="container-fluid mt-2">
    {% if update_info %}
    <div class="alert alert-info alert-dismissible fade show" role="alert">
        <i class="fas fa-info-circle me-2"></i>
        <strong>¡Nueva versión disponible!</strong> 
        Se ha detectado la versión <strong>{{ update_info.version }}</strong>.
        <a href="{{ update_info.url }}" target="_blank" class="alert-link">Ver detalles y descargar</a>.
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}
</div>
