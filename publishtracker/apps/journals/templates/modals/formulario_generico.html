<form id="formGenerico">
  {% csrf_token %}

  {% for field in form %}
    <div class="mb-3">
      {{ field.label_tag }}
      {{ field }}
      <div id="error-{{ field.name }}" class="text-danger"></div>
      {% if field.errors %}
        <div class="text-danger">{{ field.errors }}</div>
      {% endif %}
    </div>
  {% endfor %}

  <!-- Botones del footer del modal -->
  <div class="d-flex justify-content-between mt-3">
    <button type="button" class="btn btn-secondary" onclick="regresarAVistaAnterior()">← Volver</button>
    <button type="button" class="btn btn-primary" onclick="{{ accion_guardar }}()">{{ titulo_modal }}</button>
  </div>
</form>
